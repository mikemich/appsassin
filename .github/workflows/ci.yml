name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build -o appsassin .
      - name: Smoke test
        run: |
          ./appsassin version
          ./appsassin list --all
          ./appsassin sweep --dry-run
